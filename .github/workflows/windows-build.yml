name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl --fail --location --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -j -q /tmp/templates.tpz 'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
      - name: Import and test
        run: |
          set -euo pipefail
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --editor --quit
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/prototype_test.gd -- --test
      - name: Export and package
        run: |
          set -euo pipefail
          mkdir -p builds/windows
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" builds/windows/SalvageSeas.exe
          cp README.md builds/windows/README.md
          cd builds/windows
          zip -r ../Salvage-Seas-v0.01-Windows.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Salvage-Seas-v0.01-Windows
          path: builds/Salvage-Seas-v0.01-Windows.zip
          retention-days: 30

